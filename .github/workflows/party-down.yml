# The off switch. Stops the task and restores the scale-to-zero floor;
# everything on the EFS volume (library, cache, queue history) survives.
name: Party Down 🌙

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: party-switch
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER: karaokio-prod
  SERVICE: karaokio-app

jobs:
  down:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AWS auth (OIDC)
        uses: patrickisgreat/actions-toolkit/actions/aws-auth@main
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Stop the party box
        run: |
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id "service/$CLUSTER/$SERVICE" \
            --scalable-dimension ecs:service:DesiredCount \
            --min-capacity 0 --max-capacity 1
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --desired-count 0 >/dev/null
          echo "## 🌙 Party box stopped — idle cost is storage only" >> "$GITHUB_STEP_SUMMARY"
