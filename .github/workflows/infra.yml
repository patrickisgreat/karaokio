# Deploys the party-box CloudFormation stacks from cloudformation-toolkit
# templates. Manual trigger only: infra changes are rare and deliberate.
name: Infra

on:
  workflow_dispatch:
    inputs:
      toolkit-ref:
        description: cloudformation-toolkit ref to deploy templates from
        required: false
        default: main
      allowed-cidr:
        description: CIDR allowed to reach the app (0.0.0.0/0 relies on party-code auth)
        required: false
        default: 0.0.0.0/0

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout karaokio
        uses: actions/checkout@v7

      - name: Checkout cloudformation-toolkit
        uses: actions/checkout@v7
        with:
          repository: patrickisgreat/cloudformation-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: AWS auth (OIDC)
        uses: patrickisgreat/actions-toolkit/actions/aws-auth@main
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy stacks
        env:
          TOOLKIT_DIR: ${{ github.workspace }}/.toolkit
          AWS_REGION: us-east-1
          ALLOWED_CIDR: ${{ inputs.allowed-cidr }}
        run: bash infra/deploy.sh
